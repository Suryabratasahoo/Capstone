<!-- Capstone/test_frontend/mcraptor/index.html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>McRAPTOR Multi-Modal Engine - Test UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        #map { height: calc(100vh - 70px); width: 100%; z-index: 1; }
        .custom-scroll { height: calc(100vh - 340px); overflow-y: auto; }
        .transfer-pulse {
            box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
            animation: pulse-red 1.6s infinite;
            border-radius: 50%;
        }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased overflow-x-hidden">

    <header class="h-16 bg-slate-900 border-b border-purple-900/60 px-5 flex items-center justify-between shadow-md">
        <div class="flex items-center space-x-3">
            <span class="text-2xl">🔮</span>
            <div>
                <h1 class="text-xl font-bold tracking-wide text-purple-400">McRAPTOR Unified Engine</h1>
                <p class="text-xs text-slate-400 hidden sm:block">Trains, Buses & Transfers Pareto Optimization</p>
            </div>
        </div>
        <div id="apiStatus" class="flex items-center space-x-2 text-xs bg-slate-950 px-3.5 py-1.5 rounded-full border border-purple-800/50">
            <span class="w-2.5 h-2.5 rounded-full bg-yellow-500 animate-pulse"></span>
            <span class="text-slate-300 font-medium">Connecting...</span>
        </div>
    </header>

    <div class="flex flex-col lg:flex-row w-full">
        
        <aside class="w-full lg:w-[45%] bg-slate-900 border-r border-slate-800 p-4 flex flex-col space-y-3">
            
            <form id="searchForm" class="bg-slate-950 p-3.5 rounded-xl border border-purple-900/50 space-y-2.5 shadow-md">
                <div class="grid grid-cols-5 gap-2">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1">From City</label>
                        <input type="text" id="sourceInput" value="Vijayawada" placeholder="e.g. Vijayawada" required
                            class="w-full bg-slate-900 border border-slate-700 rounded-md px-2 py-1.5 text-xs text-purple-300 font-bold focus:outline-none focus:border-purple-400 font-mono tracking-wide text-center">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1">To City</label>
                        <input type="text" id="destInput" value="Bengaluru" placeholder="e.g. Bengaluru" required
                            class="w-full bg-slate-900 border border-slate-700 rounded-md px-2 py-1.5 text-xs text-purple-300 font-bold focus:outline-none focus:border-purple-400 font-mono tracking-wide text-center">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1">Time</label>
                        <input type="time" id="timeInput" value="08:00" required
                            class="w-full bg-slate-900 border border-slate-700 rounded-md px-1 py-1.5 text-xs text-slate-200 font-semibold focus:outline-none focus:border-purple-400">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1">Date</label>
                        <input type="date" id="dateInput" required
                            class="w-full bg-slate-900 border border-slate-700 rounded-md px-1 py-1.5 text-xs text-slate-200 font-semibold focus:outline-none focus:border-purple-400">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1">Class</label>
                        <select id="classSelect" class="w-full bg-slate-900 border border-slate-700 rounded-md px-1 py-1.5 text-xs text-purple-300 font-bold focus:outline-none focus:border-purple-400">
                            <option value="3A" selected>3AC</option>
                            <option value="2A">2AC</option>
                            <option value="SL">SL</option>
                        </select>
                    </div>
                </div>

                <button type="submit" id="searchBtn"
                    class="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold text-xs py-2 rounded-lg transition-colors flex items-center justify-center space-x-1.5 shadow">
                    <span>⚡ Run Multi-Modal Search</span>
                </button>
            </form>

            <div id="controlsBar" class="hidden bg-slate-950/90 p-2.5 rounded-xl border border-purple-900/40 space-y-2">
                <div class="flex items-center justify-between text-xs text-slate-300 border-b border-slate-800/80 pb-1.5">
                    <span class="font-bold text-purple-300">📊 Pareto Options</span>
                    <div class="space-x-3 text-[11px]">
                        <span>Found: <b id="foundCount" class="text-amber-400 font-bold text-xs">0</b></span>
                        <span>Time: <b id="searchTime" class="text-emerald-400 font-bold text-xs">0 ms</b></span>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2 text-xs">
                    <div>
                        <select id="filterType" onchange="applyFiltersAndSort()" class="w-full bg-slate-900 border border-slate-700 text-slate-200 rounded px-2 py-1 focus:outline-none focus:border-purple-400 text-xs">
                            <option value="ALL">Show All Routes</option>
                            <option value="DIRECT">Direct Only (0 Transfers)</option>
                            <option value="ONE_TRANSFER">1-Transfer Only</option>
                            <option value="AVAILABLE_ONLY">Confirmed Seats Only</option>
                        </select>
                    </div>

                    <div>
                        <select id="sortCriterion" onchange="applyFiltersAndSort()" class="w-full bg-slate-900 border border-slate-700 text-purple-300 font-bold rounded px-2 py-1 focus:outline-none focus:border-purple-400 text-xs">
                            <option value="DURATION">Sort by Duration (Fastest)</option>
                            <option value="PRICE">Sort by Price (Lowest)</option>
                            <option value="DISTANCE">Sort by Distance (Shortest)</option>
                            <option value="SEAT_STATUS">Sort by Status (Confirmed)</option>
                        </select>
                    </div>
                </div>
            </div>

            <div id="resultsContainer" class="custom-scroll space-y-3.5 pr-1.5">
                <p class="text-xs text-slate-500 text-center py-12">Run search to test Pareto routes on map.</p>
            </div>
        </aside>

        <main class="w-full lg:w-[55%] relative">
            <div id="map"></div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
