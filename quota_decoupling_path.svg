<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" width="780" height="340" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="q-arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="q-arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#16a34a" />
    </marker>
  </defs>

  <rect x="5" y="5" width="770" height="330" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />

  <text x="390" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a" letter-spacing="0.3">Alternate Boarding Station Quota Decoupling</text>
  <text x="390" y="47" text-anchor="middle" font-size="10.5" font-weight="500" fill="#64748b">Bypassing General Quota Waitlist through Upstream Station Reservation</text>

  <!-- Scheduled Train Path Nodes -->
  <g transform="translate(25, 70)">
    <!-- Upstream U1 -->
    <rect x="0" y="0" width="160" height="92" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
    <text x="80" y="22" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e40af">Upstream Stop U_1</text>
    <text x="80" y="38" text-anchor="middle" font-size="9.5" fill="#1e3a8a">Remote Location Quota</text>
    <rect x="12" y="46" width="136" height="20" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1" />
    <text x="80" y="60" text-anchor="middle" font-size="9.5" font-weight="700" fill="#15803d">AVAILABLE (Seats=14)</text>
    <text x="80" y="80" text-anchor="middle" font-size="9" font-weight="600" fill="#2563eb">Target Booking Origin</text>

    <!-- Arrow U1 to U2 -->
    <line x1="160" y1="46" x2="190" y2="46" stroke="#475569" stroke-width="2" marker-end="url(#q-arr)" />

    <!-- Upstream U2 -->
    <rect x="195" y="0" width="160" height="92" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" />
    <text x="275" y="22" text-anchor="middle" font-size="11.5" font-weight="700" fill="#92400e">Upstream Stop U_2</text>
    <text x="275" y="38" text-anchor="middle" font-size="9.5" fill="#78350f">Remote Location Quota</text>
    <rect x="210" y="46" width="130" height="20" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" />
    <text x="275" y="60" text-anchor="middle" font-size="9.5" font-weight="700" fill="#b45309">Status: WL 45</text>
    <text x="275" y="80" text-anchor="middle" font-size="9" fill="#78350f">Intermediate Stop</text>

    <!-- Arrow U2 to S -->
    <line x1="355" y1="46" x2="385" y2="46" stroke="#475569" stroke-width="2" marker-end="url(#q-arr)" />

    <!-- Commuter Origin S -->
    <rect x="390" y="0" width="160" height="92" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" />
    <text x="470" y="22" text-anchor="middle" font-size="11.5" font-weight="700" fill="#991b1b">Commuter Origin S</text>
    <text x="470" y="38" text-anchor="middle" font-size="9.5" fill="#7f1d1d">General Pooled Quota</text>
    <rect x="405" y="46" width="130" height="20" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1" />
    <text x="470" y="60" text-anchor="middle" font-size="9.5" font-weight="700" fill="#b91c1c">Status: WL 82 (Blocked)</text>
    <text x="470" y="80" text-anchor="middle" font-size="9" font-weight="700" fill="#991b1b">Physical Boarding Point</text>

    <!-- Arrow S to D -->
    <line x1="550" y1="46" x2="580" y2="46" stroke="#475569" stroke-width="2" marker-end="url(#q-arr)" />

    <!-- Destination D -->
    <rect x="585" y="0" width="145" height="92" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" />
    <text x="657" y="32" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Destination D</text>
    <text x="657" y="52" text-anchor="middle" font-size="10" fill="#475569">Target Arrival City</text>
    <text x="657" y="72" text-anchor="middle" font-size="9" fill="#64748b">Final Journey Terminal</text>
  </g>

  <!-- Algorithmic Action Pipeline -->
  <g transform="translate(70, 186)">
    <path d="M 35 -24 L 35 25 L 90 25" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#q-arr-green)" />
    
    <rect x="95" y="0" width="580" height="116" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" />
    <text x="285" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">OptiTransit Algorithmic Action (Legal Quota Decoupling)</text>

    <text x="30" y="50" font-size="10.5" font-weight="600" fill="#1e293b">1. <tspan font-weight="700" fill="#15803d">Book Legally from Upstream U_1 to Destination D:</tspan> Captures confirmed seat under remote quota pool.</text>
    <text x="30" y="72" font-size="10.5" font-weight="600" fill="#1e293b">2. <tspan font-weight="700" fill="#15803d">Amend Official Boarding Station to S:</tspan> Free via IRCTC / Commercial Circular 62/2018 policy.</text>
    <text x="30" y="94" font-size="10.5" font-weight="600" fill="#1e293b">3. <tspan font-weight="700" fill="#15803d">Fare Delta Verification:</tspan> Extra fare difference capped at &lt;= 15% -> Guarantees confirmed seat.</text>
  </g>
</svg>
