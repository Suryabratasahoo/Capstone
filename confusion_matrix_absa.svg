<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" width="700" height="520" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <rect x="5" y="5" width="690" height="510" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />

  <!-- Title & Subtitle -->
  <text x="350" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a" letter-spacing="0.3">ABSA RoBERTa Model Confusion Matrix</text>
  <text x="350" y="50" text-anchor="middle" font-size="11" font-weight="500" fill="#64748b">Multi-Class Polarity Evaluation (N = 2,400 Annotated Test Samples)</text>

  <!-- Y-Axis Label: Actual Class -->
  <text x="30" y="240" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a" transform="rotate(-90 30 240)">ACTUAL CLASS</text>

  <!-- X-Axis Label: Predicted Class -->
  <text x="330" y="85" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">PREDICTED CLASS</text>

  <!-- Matrix Grid -->
  <g transform="translate(130, 105)">
    <!-- Column Headers -->
    <rect x="70" y="0" width="110" height="28" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1" />
    <text x="125" y="18" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">Positive</text>

    <rect x="190" y="0" width="110" height="28" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1" />
    <text x="245" y="18" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">Neutral</text>

    <rect x="310" y="0" width="110" height="28" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1" />
    <text x="365" y="18" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">Negative</text>

    <rect x="430" y="0" width="80" height="28" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="470" y="18" text-anchor="middle" font-size="10.5" font-weight="700" fill="#334155">Total</text>

    <!-- ================= ROW 1: ACTUAL POSITIVE ================= -->
    <!-- Row Header -->
    <rect x="0" y="38" width="60" height="68" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1" />
    <text x="30" y="77" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">Positive</text>

    <!-- Cell (Pos, Pos) = 742 (True Positive) -->
    <rect x="70" y="38" width="110" height="68" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
    <text x="125" y="73" text-anchor="middle" font-size="18" font-weight="800" fill="#14532d">742</text>
    <text x="125" y="92" text-anchor="middle" font-size="9" font-weight="600" fill="#15803d">90.5% Recall</text>

    <!-- Cell (Pos, Neu) = 48 -->
    <rect x="190" y="38" width="110" height="68" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="245" y="74" text-anchor="middle" font-size="16" font-weight="700" fill="#475569">48</text>
    <text x="245" y="92" text-anchor="middle" font-size="9" fill="#64748b">5.8%</text>

    <!-- Cell (Pos, Neg) = 30 -->
    <rect x="310" y="38" width="110" height="68" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1" />
    <text x="365" y="74" text-anchor="middle" font-size="16" font-weight="700" fill="#991b1b">30</text>
    <text x="365" y="92" text-anchor="middle" font-size="9" fill="#b91c1c">3.7%</text>

    <!-- Row Total -->
    <rect x="430" y="38" width="80" height="68" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="470" y="75" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">820</text>
    <text x="470" y="92" text-anchor="middle" font-size="8.5" fill="#64748b">Actual Pos</text>

    <!-- ================= ROW 2: ACTUAL NEUTRAL ================= -->
    <!-- Row Header -->
    <rect x="0" y="114" width="60" height="68" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1" />
    <text x="30" y="153" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">Neutral</text>

    <!-- Cell (Neu, Pos) = 52 -->
    <rect x="70" y="114" width="110" height="68" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="125" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#475569">52</text>
    <text x="125" y="168" text-anchor="middle" font-size="9" fill="#64748b">7.2%</text>

    <!-- Cell (Neu, Neu) = 612 (True Neutral) -->
    <rect x="190" y="114" width="110" height="68" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
    <text x="245" y="149" text-anchor="middle" font-size="18" font-weight="800" fill="#14532d">612</text>
    <text x="245" y="168" text-anchor="middle" font-size="9" font-weight="600" fill="#15803d">85.0% Recall</text>

    <!-- Cell (Neu, Neg) = 56 -->
    <rect x="310" y="114" width="110" height="68" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1" />
    <text x="365" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#991b1b">56</text>
    <text x="365" y="168" text-anchor="middle" font-size="9" fill="#b91c1c">7.8%</text>

    <!-- Row Total -->
    <rect x="430" y="114" width="80" height="68" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="470" y="151" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">720</text>
    <text x="470" y="168" text-anchor="middle" font-size="8.5" fill="#64748b">Actual Neu</text>

    <!-- ================= ROW 3: ACTUAL NEGATIVE ================= -->
    <!-- Row Header -->
    <rect x="0" y="190" width="60" height="68" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1" />
    <text x="30" y="229" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">Negative</text>

    <!-- Cell (Neg, Pos) = 24 -->
    <rect x="70" y="190" width="110" height="68" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1" />
    <text x="125" y="226" text-anchor="middle" font-size="16" font-weight="700" fill="#991b1b">24</text>
    <text x="125" y="244" text-anchor="middle" font-size="9" fill="#b91c1c">2.8%</text>

    <!-- Cell (Neg, Neu) = 42 -->
    <rect x="190" y="190" width="110" height="68" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="245" y="226" text-anchor="middle" font-size="16" font-weight="700" fill="#475569">42</text>
    <text x="245" y="244" text-anchor="middle" font-size="9" fill="#64748b">4.9%</text>

    <!-- Cell (Neg, Neg) = 794 (True Negative) -->
    <rect x="310" y="190" width="110" height="68" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
    <text x="365" y="225" text-anchor="middle" font-size="18" font-weight="800" fill="#14532d">794</text>
    <text x="365" y="244" text-anchor="middle" font-size="9" font-weight="600" fill="#15803d">92.3% Recall</text>

    <!-- Row Total -->
    <rect x="430" y="190" width="80" height="68" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="470" y="227" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">860</text>
    <text x="470" y="244" text-anchor="middle" font-size="8.5" fill="#64748b">Actual Neg</text>

    <!-- ================= ROW 4: COLUMN TOTALS / PRECISION ================= -->
    <rect x="0" y="266" width="60" height="48" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="30" y="295" text-anchor="middle" font-size="10.5" font-weight="700" fill="#334155">Total</text>

    <rect x="70" y="266" width="110" height="48" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="125" y="286" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">818</text>
    <text x="125" y="303" text-anchor="middle" font-size="9" font-weight="600" fill="#2563eb">90.7% Precision</text>

    <rect x="190" y="266" width="110" height="48" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="245" y="286" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">702</text>
    <text x="245" y="303" text-anchor="middle" font-size="9" font-weight="600" fill="#2563eb">87.2% Precision</text>

    <rect x="310" y="266" width="110" height="48" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="365" y="286" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">880</text>
    <text x="365" y="303" text-anchor="middle" font-size="9" font-weight="600" fill="#2563eb">90.2% Precision</text>

    <rect x="430" y="266" width="80" height="48" rx="4" fill="#0f172a" stroke="#0f172a" stroke-width="1" />
    <text x="470" y="287" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff">2,400</text>
    <text x="470" y="303" text-anchor="middle" font-size="8.5" fill="#94a3b8">N Total</text>
  </g>

  <!-- Summary Footer Box -->
  <g transform="translate(100, 445)">
    <rect x="0" y="0" width="500" height="50" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" />
    <text x="250" y="22" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14532d">Model Performance Summary</text>
    <text x="250" y="38" text-anchor="middle" font-size="10.5" font-weight="600" fill="#15803d">Overall Accuracy: 89.9%  |  Macro F1-Score: 0.891  |  Weighted Average F1: 0.897</text>
  </g>
</svg>