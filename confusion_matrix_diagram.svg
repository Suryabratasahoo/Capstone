    <text x="230" y="20" text-anchor="middle" font-size="10.5" font-weight="600" fill="#334155">Summary: Macro Precision = 89.4% | Macro Recall = 89.3% | Macro F1-Score = 89.3% | Accuracy = 89.5%</text>
