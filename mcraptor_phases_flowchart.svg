<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 620" width="660" height="620" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrowhead Marker -->
    <marker id="flow-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#334155" />
    </marker>
  </defs>

  <!-- Outer Border Frame -->
  <rect x="5" y="5" width="650" height="610" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />

  <!-- Flowchart Title -->
  <text x="330" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a" letter-spacing="0.3">McRAPTOR Algorithmic Execution Phases</text>
  <text x="330" y="54" text-anchor="middle" font-size="11" font-weight="500" fill="#64748b">Three-Phase Multi-Modal Schedule Traversal and Pareto Optimization</text>

  <!-- ==================== PHASE 1 ==================== -->
  <g transform="translate(50, 75)">
    <!-- Phase 1 Box -->
    <rect x="0" y="0" width="560" height="96" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" />
    
    <!-- Phase Header Pill -->
    <rect x="18" y="12" width="280" height="24" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1" />
    <text x="28" y="28" font-size="11.5" font-weight="700" fill="#1e40af">Phase 1: Spatial Urban Cluster Resolution</text>

    <!-- Phase Content Text -->
    <text x="25" y="56" font-size="11.5" font-weight="600" fill="#1e293b">• Input: User Query (Source City, Destination City, Travel Date, Class)</text>
    <text x="25" y="74" font-size="11" fill="#334155">• Resolve City Names → Origin Stops P_src, Destination Stops P_dst</text>
    <text x="25" y="88" font-size="10" fill="#64748b">  (Aggregates rail junctions, terminal stations, and intercity bus depots)</text>
  </g>

  <!-- Arrow 1: Phase 1 -> Phase 2 -->
  <line x1="330" y1="171" x2="330" y2="204" stroke="#334155" stroke-width="2.5" marker-end="url(#flow-arrow)" />

  <!-- ==================== PHASE 2 ==================== -->
  <g transform="translate(50, 206)">
    <!-- Phase 2 Box -->
    <rect x="0" y="0" width="560" height="136" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2" />
    
    <!-- Phase Header Pill -->
    <rect x="18" y="12" width="280" height="24" rx="5" fill="#f1f5f9" stroke="#475569" stroke-width="1" />
    <text x="28" y="28" font-size="11.5" font-weight="700" fill="#0f172a">Phase 2: Round 0 Traversal (Direct Services)</text>

    <!-- Phase Content Text -->
    <text x="25" y="56" font-size="11.5" font-weight="600" fill="#1e293b">• For each transit route r passing through origin stops P_src:</text>
    <text x="35" y="75" font-size="11" fill="#334155">1. Scan scheduled trips t in T_r departing on or after query time</text>
    <text x="35" y="93" font-size="11" fill="#334155">2. Traverse stops downstream towards destination stops P_dst</text>
    <text x="35" y="111" font-size="11" fill="#334155">3. Record non-dominated direct arrival labels in bag B_0(P_dst)</text>
    <text x="35" y="125" font-size="10" fill="#64748b">   (Prunes slower/dominated direct trips via Pareto dominance)</text>
  </g>

  <!-- Arrow 2: Phase 2 -> Phase 3 -->
  <line x1="330" y1="342" x2="330" y2="375" stroke="#334155" stroke-width="2.5" marker-end="url(#flow-arrow)" />

  <!-- ==================== PHASE 3 ==================== -->
  <g transform="translate(50, 377)">
    <!-- Phase 3 Box -->
    <rect x="0" y="0" width="560" height="188" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" />
    
    <!-- Phase Header Pill -->
    <rect x="18" y="12" width="310" height="24" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="1" />
    <text x="28" y="28" font-size="11.5" font-weight="700" fill="#14532d">Phase 3: Round 1 Traversal (1-Transfer Multi-Modal)</text>

    <!-- Phase Content Text -->
    <text x="25" y="56" font-size="11" fill="#1e293b">1. <tspan font-weight="700">Collect Intermediate Hubs:</tspan> Identify stops marked in Round 0</text>
    
    <text x="25" y="77" font-size="11" fill="#1e293b">2. <tspan font-weight="700">Temporal Layover Validation:</tspan> For each intermediate hub,</text>
    <text x="40" y="94" font-size="10.5" fill="#15803d">Enforce connection constraint: 40 min &lt;= Layover &lt;= 180 min</text>
    
    <text x="25" y="115" font-size="11" fill="#1e293b">3. <tspan font-weight="700">Multi-Modal Evaluation:</tspan> Connect across heterogeneous networks:</text>
    <text x="40" y="132" font-size="10.5" fill="#334155">(Train + Bus, Bus + Train, Train + Train, Bus + Bus)</text>
    
    <text x="25" y="153" font-size="11" fill="#1e293b">4. <tspan font-weight="700">Pareto Frontier Update:</tspan> Merge Round 0 and Round 1 labels</text>
    <text x="40" y="170" font-size="10" fill="#166534">Deliver optimal non-dominated itineraries at P_dst</text>
  </g>
</svg>
