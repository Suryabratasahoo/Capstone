<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 540" width="680" height="540" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="test-arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#334155" />
    </marker>
  </defs>

  <rect x="5" y="5" width="670" height="530" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />

  <text x="340" y="32" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a" letter-spacing="0.3">Three-Tier Testing &amp; Validation Framework</text>
  <text x="340" y="49" text-anchor="middle" font-size="10.5" font-weight="500" fill="#64748b">Hierarchical Quality Assurance from Algorithmic Units to Intercity Corridors</text>

  <!-- Tier 1: Unit Testing -->
  <g transform="translate(60, 70)">
    <rect x="0" y="0" width="560" height="114" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" />
    <rect x="18" y="10" width="230" height="22" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1" />
    <text x="26" y="25" font-size="11.5" font-weight="700" fill="#1e40af">1. UNIT TESTING (pytest &amp; Jest)</text>

    <text x="25" y="48" font-size="11" font-weight="500" fill="#1e293b">• McRAPTOR round traversal &amp; arrival label bag update invariants</text>
    <text x="25" y="66" font-size="11" font-weight="500" fill="#1e293b">• Haversine geodesic distance accuracy (error margin &lt; 0.005 km)</text>
    <text x="25" y="84" font-size="11" font-weight="500" fill="#1e293b">• Strict 4-dimensional Pareto dominance and early pruning logic</text>
    <text x="25" y="102" font-size="11" font-weight="500" fill="#1e293b">• Pydantic V2 schema validation and input string sanitization</text>
  </g>
  <line x1="340" y1="184" x2="340" y2="214" stroke="#334155" stroke-width="2.5" marker-end="url(#test-arr)" />

  <!-- Tier 2: Integration Testing -->
  <g transform="translate(60, 216)">
    <rect x="0" y="0" width="560" height="114" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2" />
    <rect x="18" y="10" width="220" height="22" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1" />
    <text x="26" y="25" font-size="11.5" font-weight="700" fill="#92400e">2. INTEGRATION TESTING</text>

    <text x="25" y="48" font-size="11" font-weight="500" fill="#1e293b">• FastAPI Gateway (Port 8000) &lt;--&gt; SQLite (final.db) indexed queries</text>
    <text x="25" y="66" font-size="11" font-weight="500" fill="#1e293b">• Gateway &lt;--&gt; ABSA Sentiment Microservice (Port 8001) async HTTP</text>
    <text x="25" y="84" font-size="11" font-weight="500" fill="#1e293b">• Next.js 14 Client &lt;--&gt; Backend REST API contracts and error traps</text>
    <text x="25" y="102" font-size="11" font-weight="500" fill="#1e293b">• Next.js Copilot Route &lt;--&gt; Groq LPU Cloud API payload streaming</text>
  </g>
  <line x1="340" y1="330" x2="340" y2="360" stroke="#334155" stroke-width="2.5" marker-end="url(#test-arr)" />

  <!-- Tier 3: System & Corridor Validation -->
  <g transform="translate(60, 362)">
    <rect x="0" y="0" width="560" height="114" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" />
    <rect x="18" y="10" width="280" height="22" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="1" />
    <text x="26" y="25" font-size="11.5" font-weight="700" fill="#14532d">3. SYSTEM &amp; CORRIDOR VALIDATION</text>

    <text x="25" y="48" font-size="11" font-weight="500" fill="#1e293b">• Stress testing on high-density corridor: Vijayawada --&gt; Bangalore</text>
    <text x="25" y="66" font-size="11" font-weight="500" fill="#1e293b">• Stress testing on interstate corridor: Visakhapatnam --&gt; Sambalpur</text>
    <text x="25" y="84" font-size="11" font-weight="500" fill="#1e293b">• Query latency distribution benchmarks (Mean: 394.16 ms, P95 &lt; 480 ms)</text>
    <text x="25" y="102" font-size="11" font-weight="500" fill="#1e293b">• Confirmed seat delivery rate verification (100% on saturated routes)</text>
  </g>
</svg>
