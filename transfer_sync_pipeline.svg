<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="sync-arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#334155" />
    </marker>
    <marker id="sync-arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#d97706" />
    </marker>
  </defs>

  <rect x="5" y="5" width="750" height="270" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />

  <text x="380" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a" letter-spacing="0.3">Transfer Synchronization Pipeline</text>
  <text x="380" y="47" text-anchor="middle" font-size="10.5" font-weight="500" fill="#64748b">Spatial Geodetic Transfer and Temporal Layover Buffer Enforcement</text>

  <!-- Arrival Leg 1 -->
  <g transform="translate(30, 75)">
    <rect x="0" y="0" width="150" height="74" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" />
    <text x="75" y="24" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e40af">Arrival Leg 1</text>
    <text x="75" y="42" text-anchor="middle" font-size="10" fill="#1e3a8a">(Train / Bus)</text>
    <rect x="20" y="48" width="110" height="18" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1" />
    <text x="75" y="61" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af">T_arr (Leg 1)</text>
  </g>

  <!-- Arrow Leg 1 to Walk -->
  <line x1="180" y1="112" x2="265" y2="112" stroke="#334155" stroke-width="2" marker-end="url(#sync-arr)" />
  <rect x="195" y="96" width="55" height="18" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
  <text x="222" y="109" text-anchor="middle" font-size="9.5" font-weight="600" fill="#475569">Transfer</text>

  <!-- Walking Transfer Box -->
  <g transform="translate(275, 65)">
    <rect x="0" y="0" width="190" height="94" rx="8" fill="#fdf4ff" stroke="#c026d3" stroke-width="1.5" />
    <text x="95" y="22" text-anchor="middle" font-size="11" font-weight="700" fill="#86198f">Walking Transfer</text>
    <text x="95" y="38" text-anchor="middle" font-size="9.5" fill="#a21caf">Haversine Distance</text>
    <rect x="25" y="45" width="140" height="20" rx="4" fill="#ffffff" stroke="#f0abfc" stroke-width="1" />
    <text x="95" y="59" text-anchor="middle" font-size="9.5" font-weight="700" fill="#701a75">d(Stop_1, Stop_2)</text>
    <text x="95" y="80" text-anchor="middle" font-size="10" font-weight="700" fill="#c026d3">Distance &lt;= 5.0 km</text>
  </g>

  <!-- Arrow Walk to Departure Leg 2 -->
  <line x1="465" y1="112" x2="565" y2="112" stroke="#334155" stroke-width="2" marker-end="url(#sync-arr)" />

  <!-- Departure Leg 2 -->
  <g transform="translate(575, 75)">
    <rect x="0" y="0" width="150" height="74" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" />
    <text x="75" y="24" text-anchor="middle" font-size="11.5" font-weight="700" fill="#065f46">Departure Leg 2</text>
    <text x="75" y="42" text-anchor="middle" font-size="10" fill="#047857">(Bus / Train)</text>
    <rect x="20" y="48" width="110" height="18" rx="4" fill="#ffffff" stroke="#6ee7b7" stroke-width="1" />
    <text x="75" y="61" text-anchor="middle" font-size="10" font-weight="700" fill="#047857">T_dep (Leg 2)</text>
  </g>

  <!-- Arrow from Walk down to Buffer -->
  <line x1="370" y1="159" x2="370" y2="188" stroke="#d97706" stroke-width="2" marker-end="url(#sync-arr-amber)" />

  <!-- Temporal Layover Buffer -->
  <g transform="translate(230, 195)">
    <rect x="0" y="0" width="280" height="64" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" />
    <text x="140" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">Temporal Layover Safety Buffer</text>
    <text x="140" y="38" text-anchor="middle" font-size="10" font-weight="600" fill="#78350f">Standard Commuter: 40 to 180 min</text>
    <text x="140" y="52" text-anchor="middle" font-size="10" font-weight="700" fill="#b45309">Senior Citizen Mode: 60 to 180 min</text>
  </g>

  <!-- Connecting Path from Buffer up to Leg 2 -->
  <path d="M 510 227 L 650 227 L 650 157" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#sync-arr-amber)" />
</svg>
